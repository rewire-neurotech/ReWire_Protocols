services:
  - type: web
    name: rewire
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    disk:
      name: audio-storage
      mountPath: /data/audio
      sizeGB: 20
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEV_MODE
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: FFMPEG_BIN
        value: /usr/bin/ffmpeg
      - key: FFPROBE_BIN
        value: /usr/bin/ffprobe
      - key: ALLOWED_ORIGINS
        value: "*"
      # ADMIN CONSOLE: comma-separated emails promoted to is_admin on boot.
      # sync:false keeps the actual value in the Render dashboard rather than
      # in the repo, matching how every other credential here is handled.
      # Accounts must already exist; this only ever grants the flag, never
      # revokes it. Leaving it unset is safe -- the app runs normally and simply
      # has no admins.
      #   ADMIN_EMAILS=felix@rewire.bio,ashwin@rewire.bio
      - key: ADMIN_EMAILS
        sync: false
      # INTERNAL TESTING ONLY: set to "true" to enable the admin/admin console
      # login. Leave unset (or remove) for production -- unset, the code path
      # does not exist. Optional overrides: ADMIN_DEV_USER, ADMIN_DEV_PASS.
      - key: ADMIN_DEV_LOGIN
        sync: false
      - key: OUT_DIR
        value: /data/audio
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_PRICE_ID_PROTOCOL
        sync: false
      - key: STRIPE_PRICE_ID_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ID_YEARLY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
