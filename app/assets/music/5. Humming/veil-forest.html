<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0E8">
<title>Veil — forest</title>
<style>
/* ==========================================================
   VEIL / FOREST
   Drop-in animated background. No assets, seamless 120s loop.
   Same markup and API as veil-shore.
   ========================================================== */
.veil{
  --paper:#EDF0E8;
  --veil:.32;
  --grain:.05;
  --depth:.85;
  --sway:1;
  position:fixed;inset:0;z-index:0;
  background:var(--paper);overflow:hidden;isolation:isolate;
}
.veil canvas{
  position:absolute;inset:-8%;width:116%;height:116%;display:block;
  animation:veil-breathe 24s ease-in-out infinite;will-change:transform;
}
@keyframes veil-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.veil .scrim{position:absolute;inset:0;background:var(--paper);opacity:var(--veil)}
.veil .vignette{
  position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 38%, transparent 30%, var(--paper) 100%);
  opacity:calc(var(--veil) * 1.3);
}
.veil .grain{
  position:absolute;inset:0;opacity:var(--grain);mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
}
.veil .scrim,.veil .vignette,.veil .grain{pointer-events:none}
@media (prefers-reduced-motion:reduce){.veil canvas{animation:none}}

html,body{margin:0;height:100%;background:#EDF0E8}
</style>
</head>
<body>

<div class="veil" id="veil">
  <canvas></canvas>
  <div class="scrim"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>

<script>
/* VeilForest.mount(el) -> {stop, start}. Auto-mounts #veil if present. */
window.VeilForest = (function(){
  var TAU = Math.PI*2;
  var CFG = {
    loop:   120,  // seconds, seamless
    blur:   5,    // px inside a 110px canvas, ~18px on a phone screen
    speed:  2,    // integer only — non-integers break the loop join
    trunks: 13,
    width:  110   // canvas backing store width
  };

  /* deterministic scatter, so the same wood loads every time */
  function h(i){ var s = Math.sin(i*127.1 + i*i*3.7)*43758.5453; return s - Math.floor(s); }

  function mount(root){
    var cv = root.querySelector('canvas');
    var ctx = cv.getContext('2d');
    var SW = CFG.width, SH = 220, raf = 0, running = false;

    var TR = [];
    for (var t=0; t<CFG.trunks; t++){
      TR.push({ x:h(t)*1.15 - .07, d:h(t+40), lean:(h(t+90)-.5)*.9, ph:h(t+7)*6.28 });
    }
    TR.sort(function(a,b){ return b.d - a.d; });   // far ones first

    function resize(){
      var w = cv.clientWidth || innerWidth, hh = cv.clientHeight || innerHeight;
      SH = Math.round(SW * hh / w);
      cv.width = SW; cv.height = SH;
    }
    function num(p){ return parseFloat(getComputedStyle(root).getPropertyValue('--'+p)) || 0; }

    function draw(p){
      var depth = num('depth'), sway = num('sway'), s = CFG.speed;
      var W = SW, H = SH;
      var i, x, y, g;
      var fSway = 6*s, fLeaf = 20*s, fLight = 4*s, fFloor = 3*s;

      ctx.filter = 'none';
      ctx.clearRect(0,0,W,H);

      g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#F2F6E9'); g.addColorStop(.22,'#D3E2C2');
      g.addColorStop(.62,'#96B287'); g.addColorStop(1,'#5E7454');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

      var lift = .5 + .5*Math.sin(TAU*p - Math.PI/2);
      var gx = W*.5 + Math.sin(TAU*fLight*p*.5)*W*.16;
      g = ctx.createRadialGradient(gx,H*.28,0,gx,H*.28,W*.85);
      g.addColorStop(0,'rgba(255,255,240,'+(.30+.55*lift)+')');
      g.addColorStop(.4,'rgba(250,255,235,'+(.12+.22*lift)+')');
      g.addColorStop(1,'rgba(250,255,235,0)');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

      if (CFG.blur > 0 && 'filter' in ctx) ctx.filter = 'blur('+CFG.blur+'px)';
      ctx.lineCap = 'round';

      for (i=0;i<CFG.trunks;i++){
        var T = TR[i], d = T.d;
        ctx.lineWidth = .9 + Math.pow(1-d,2)*7.5;
        ctx.strokeStyle = 'rgba(30,52,32,'+((.10 + Math.pow(1-d,1.6)*.42)*depth)+')';
        var amp = (.7 + (1-d)*2.6) * sway;
        ctx.beginPath();
        for (y=-4; y<=H*.98; y+=5){
          var up = 1 - y/H;                          // the top moves, the base holds
          x = T.x*W + T.lean*up*up*W*.10
            + Math.sin(TAU*fSway*p + T.ph)*amp*up*up
            + Math.sin(TAU*fLeaf*p + T.ph*2)*amp*.22*up*up;
          y === -4 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
        }
        ctx.stroke();
      }

      for (i=0;i<7;i++){
        var cx = (h(i+200)*1.2 - .1)*W + Math.sin(TAU*fLeaf*p + i*1.9)*W*.035*sway;
        var cy = (h(i+300)*.30 - .06)*H + Math.sin(TAU*fSway*p + i)*H*.012*sway;
        var cr = (.20 + h(i+400)*.24)*W;
        g = ctx.createRadialGradient(cx,cy,0,cx,cy,cr);
        g.addColorStop(0,'rgba(36,60,36,'+(.34*depth)+')');
        g.addColorStop(.55,'rgba(40,66,40,'+(.16*depth)+')');
        g.addColorStop(1,'rgba(40,66,40,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,cr,0,TAU); ctx.fill();
      }

      for (i=0;i<3;i++){
        var pulse = (Math.sin(TAU*fLight*p + i*2.2) + 1)/2;
        var sx = (.22 + i*.28)*W + Math.sin(TAU*fLight*p*.5 + i)*W*.05;
        ctx.save();
        ctx.translate(sx,0); ctx.rotate(.30 + i*.05);
        g = ctx.createLinearGradient(0,0,0,H*.95);
        g.addColorStop(0,'rgba(255,255,238,'+((.10+.22*pulse)*depth)+')');
        g.addColorStop(.65,'rgba(255,255,238,'+((.04+.10*pulse)*depth)+')');
        g.addColorStop(1,'rgba(255,255,238,0)');
        ctx.fillStyle = g; ctx.fillRect(-W*.055,-H*.05,W*.11,H*1.05);
        ctx.restore();
      }

      for (i=0;i<9;i++){
        var dx = (h(i+500)*1.1 - .05)*W + Math.sin(TAU*fFloor*p + i*1.4)*W*.07;
        var dy = H*(.68 + h(i+600)*.30) + Math.sin(TAU*fFloor*p*2 + i)*H*.010;
        var dr = (.06 + h(i+700)*.10)*W;
        var da = (.18 + .22*((Math.sin(TAU*fLeaf*p*.5 + i*2.6) + 1)/2))*depth;
        g = ctx.createRadialGradient(dx,dy,0,dx,dy,dr);
        g.addColorStop(0,'rgba(255,255,235,'+da+')');
        g.addColorStop(1,'rgba(255,255,235,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(dx,dy,dr,0,TAU); ctx.fill();
      }

      for (i=0;i<6;i++){
        var ux = (h(i+800)*1.2 - .1)*W + Math.sin(TAU*fSway*p + i*2.1)*W*.02*sway;
        var uy = H*(.90 + h(i+900)*.14);
        var ur = (.16 + h(i+950)*.16)*W;
        g = ctx.createRadialGradient(ux,uy,0,ux,uy,ur);
        g.addColorStop(0,'rgba(34,56,34,'+(.34*depth)+')');
        g.addColorStop(1,'rgba(34,56,34,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ux,uy,ur,0,TAU); ctx.fill();
      }

      g = ctx.createLinearGradient(0,H*.30,0,H*.75);
      g.addColorStop(0,'rgba(226,238,214,.30)');
      g.addColorStop(1,'rgba(226,238,214,0)');
      ctx.fillStyle = g; ctx.fillRect(0,H*.30,W,H*.45);

      ctx.filter = 'none';
    }

    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    function frame(){
      raf = requestAnimationFrame(frame);
      draw(((performance.now()/1000) % CFG.loop) / CFG.loop);
    }
    function start(){
      if (running) return;
      running = true;
      if (reduce) { draw(.15); return; }
      raf = requestAnimationFrame(frame);
    }
    function stop(){ running = false; cancelAnimationFrame(raf); }

    addEventListener('resize', function(){ resize(); if (!running || reduce) draw(.15); });
    document.addEventListener('visibilitychange', function(){
      document.hidden ? stop() : start();          // idle in the background
    });

    resize(); start();
    return { start:start, stop:stop, cfg:CFG };
  }

  var el = document.getElementById('veil');
  return { mount:mount, instance: el ? mount(el) : null };
})();
</script>
</body>
</html>
